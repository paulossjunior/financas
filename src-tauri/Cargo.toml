[package]
name = "financas"
version = "0.1.0"
description = "Gestor Financeiro — Dashboard de Faturas BTG"
authors = []
license = ""
repository = ""
edition = "2021"

[lib]
name = "financas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "financas"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = { version = "0.26", features = ["dates"] }
rust_decimal = { version = "1.35", features = ["serde-float", "serde-str"] }
rust_decimal_macros = "1.35"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
