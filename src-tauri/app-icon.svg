<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12886e"/>
      <stop offset="1" stop-color="#0b5a4b"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#tile)"/>

  <!-- Category ring -->
  <g fill="none" stroke-width="140" stroke-linecap="round">
    <circle cx="512" cy="512" r="300" stroke="#ffffff"              stroke-dasharray="600 1285" transform="rotate(-90 512 512)"/>
    <circle cx="512" cy="512" r="300" stroke="rgba(255,255,255,.80)" stroke-dasharray="474 1411" transform="rotate(33 512 512)"/>
    <circle cx="512" cy="512" r="300" stroke="rgba(255,255,255,.56)" stroke-dasharray="363 1522" transform="rotate(132 512 512)"/>
    <circle cx="512" cy="512" r="300" stroke="#f6b48f"              stroke-dasharray="237 1648" transform="rotate(212 512 512)"/>
  </g>
</svg>
